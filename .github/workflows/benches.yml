name: benches

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "bench/results/**"
  workflow_dispatch:
    inputs:
      oklang_ref:
        description: "oklang ref to bench (codeberg)"
        required: false
        default: "master"
  # the bench bridge (P6 round two): a cadence that watches the oklang
  # landing branch and benches each NEW tip exactly once. the gate job
  # below skips the run when the tip was already benched, so the schedule
  # costs a git ls-remote when nothing moved. 17 past the hour, every 6h,
  # off the top-of-hour load.
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

# Prevent two benchmark runs from publishing over each other.
concurrency:
  group: benchmark-results-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # the bridge gate: for scheduled runs, resolve the oklang landing branch's
  # tip and compare it with the last published run's sha (bench/results/
  # run-info.txt). push- and dispatch-triggered runs pass through - they are
  # human intent, the gate only exists to keep the cadence idempotent.
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      oklang_ref: ${{ steps.gate.outputs.oklang_ref }}
    steps:
      - name: checkout collab (for the last run-info)
        uses: actions/checkout@v4
      - name: gate
        id: gate
        env:
          BRIDGED_REF: reconciliation
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "oklang_ref=${{ inputs.oklang_ref || 'master' }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip="$(git ls-remote https://codeberg.org/qais/oklang.git "refs/heads/${BRIDGED_REF}" | cut -f1)"
          if [[ -z "$tip" ]]; then
            echo "ls-remote came back empty; running anyway (fail open)"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "oklang_ref=${BRIDGED_REF}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prev="$(sed -n 's/^oklang_ref:.*(\([0-9a-fA-F]\{7,40\}\)).*$/\1/p' bench/results/latest/run-info.txt 2>/dev/null | head -1)"
          if [[ "$tip" == "$prev" ]]; then
            echo "${BRIDGED_REF} tip ${tip:0:7} already benched; skipping"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "oklang_ref=${BRIDGED_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "${BRIDGED_REF} moved: ${prev:-none} -> ${tip:0:7}; benching"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "oklang_ref=${BRIDGED_REF}" >> "$GITHUB_OUTPUT"
          fi

  bench:
    needs: bridge
    if: always() && needs.bridge.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: checkout collab
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lua5.4 hyperfine g++-14 python3-matplotlib
          sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua
          lua -v
          python3 --version
          hyperfine --version

      - name: clone oklang
        run: |
          git clone --depth 1 --branch "${OKLANG_REF}" \
            https://codeberg.org/qais/oklang.git /tmp/oklang
        env:
          OKLANG_REF: ${{ needs.bridge.outputs.oklang_ref }}

      - name: record ref
        run: echo "OKLANG_SHA=$(git -C /tmp/oklang rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: build oklang (release)
        run: |
          cmake -S /tmp/oklang -B /tmp/oklang/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14
          cmake --build /tmp/oklang/build --parallel
          /tmp/oklang/build/ok --version

      - name: build wren (optional column)
        run: |
          # best effort: a failed build just drops the wren column, it must
          # never fail the run
          git clone --depth 1 https://github.com/wren-lang/wren-cli.git /tmp/wren-cli
          if make -C /tmp/wren-cli/projects/make config=release_64bit -j2 >/tmp/wren-build.log 2>&1; then
            if [[ -x /tmp/wren-cli/bin/wren_cli ]]; then
              /tmp/wren-cli/bin/wren_cli --version
              echo "WREN_BIN=/tmp/wren-cli/bin/wren_cli" >> "$GITHUB_ENV"
            fi
          else
            echo "wren build failed; running without the wren column"
            tail -20 /tmp/wren-build.log || true
          fi

      - name: run benchmarks
        working-directory: bench
        env:
          OK_REGISTER: /tmp/oklang/build/ok
          OK_STACK: ""
          WREN: ${{ env.WREN_BIN }}
          RUNS: "15"
          WARMUP: "5"
        run: ./run-benchmarks.sh benchmarks results/_staging

      - name: combine markdown
        working-directory: bench
        run: python3 combine.py -s results/_staging -o results/_staging/combined.md -e .md

      - name: baseline diff (the advisory column)
        working-directory: bench
        run: python3 baseline-diff.py results/_staging

      - name: generate plots
        working-directory: bench
        run: python3 plot.py --input results/_staging

      - name: write run info
        working-directory: bench
        env:
          OKLANG_REF_INPUT: ${{ inputs.oklang_ref || 'master' }}
          WARMUP: "5"
          RUNS: "15"
        run: |
          {
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "oklang_ref: ${OKLANG_REF_INPUT} (${OKLANG_SHA})"
            echo "runner: github ubuntu-latest ($(uname -m))"
            echo "lua: $(lua -v 2>&1)"
            echo "python: $(python3 --version 2>&1)"
            echo "wren: $([[ -n "${WREN_BIN:-}" ]] && "${WREN_BIN}" --version 2>&1 || echo "not built (column absent)")"
            echo "hyperfine: $(hyperfine --version)"
            echo "protocol: warmup=${WARMUP} runs=${RUNS}"
            echo "benchmark_count: $(find results/_staging -maxdepth 1 -name '*.json' | wc -l)"
            echo "note: ok-register was built from source at the ref above."
            echo "note: ok-stack is included only for benchmarks listed in stack-compatible.txt when OK_STACK is configured."
            echo "note: wren is included only for benchmarks with a .wren port when the wren build succeeded."
            echo "note: classes-only benchmarks are skipped until the benched oklang speaks classes."
          } > results/_staging/run-info.txt

      - name: publish results and prune archive
        working-directory: bench
        run: python3 publish-results.py --results results --keep 3

      - name: commit results
        run: |
          git config user.name "bench-bot"
          git config user.email "bench-bot@users.noreply.github.com"
          git add bench/results/

          if git diff --cached --quiet; then
            echo "no result changes, nothing to commit"
          else
            git commit -m "bench: automated run (oklang ${OKLANG_SHA:0:7})"
            git push
          fi
